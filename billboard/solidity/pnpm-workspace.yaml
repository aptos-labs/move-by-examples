# pnpm 11 reads overrides/auditConfig from this file, not package.json.
# Ignored GHSAs have no compatible patch:
# - GHSA-848j-6mx2-7j84 elliptic (no patched release)
# - GHSA-wrjc-x8rr-h8h6 / GHSA-337j-9hxr-rhxg react-router (patched only in v7)
# Solana Next apps also ignore image-size (GHSA-5p2g-fcmc-qvqq, GHSA-w3rx-r6r6-pgpr),
# nx CORS (GHSA-g2r8-wvmj-jf5w), and bigint-buffer (GHSA-3gc7-fjrx-p6mg).
overrides:
  next: 15.5.25
  "minimatch@^3": ^3.1.4
  "minimatch@^9": ^9.0.7
  cross-spawn: ^6.0.6
  "serialize-javascript@<7.0.5": ^7.0.5
  webpack-dev-server: ^5.2.1
  file-type: ^21.3.1
  "postcss@^8": ^8.5.10
  "@tootallnate/once": ^3.0.1
  tmp: ^0.2.6
  cookie: ^0.7.0
  undici: ^6.28.1
  "uuid@<11.1.1": ">=11.1.1"
  ws: ^7.5.11
  axios: ^1.20.0
  js-yaml: 4.3.2
  postcss: ^8.5.28
  "nanoid@^3": 3.3.19
  browserslist: ^4.28.7
  websocket-driver: 0.7.5
  "brace-expansion@^1": 1.1.21
  "brace-expansion@^2": 2.1.7
  adm-zip: ">=0.6.0"
  qs: ">=6.16.0"
  shell-quote: ">=1.9.0"
  "fast-uri@^3": ">=3.1.6"
  "fast-uri@^4": ">=4.1.3"
  "immutable@^4": ">=4.3.9"
  "immutable@^5": ">=5.1.8"
  "webpack-dev-server@<5.2.6": ">=5.2.6"
  "react-router-dom@^6": ^6.30.6
  "react-router@^6": ^6.30.6
  "@remix-run/router": ">=1.23.3"
  "svgo@^2": ">=2.8.4"
  "svgo@^3": ">=3.3.5"
  "toml@^4": ">=4.2.0"
  "postcss-selector-parser@^6": ">=6.1.3"
  "postcss-selector-parser@^7": ">=7.1.3"
  body-parser: ">=1.20.6"
  colord: ">=2.9.4"
  baseline-browser-mapping: ">=2.11.0"
  stream-json: ">=3.5.0"
  valibot: ">=1.4.2"
  "form-data@>=4.0.0 <4.0.6": ">=4.0.6"
  "fast-uri@<=3.1.1": ">=3.1.6"
  "qs@>=6.11.1 <=6.15.1": ">=6.16.0"
  "shell-quote@>=1.1.0 <=1.8.3": ">=1.9.0"
  "tmp@<0.2.6": ">=0.2.6"
  "webpack-dev-server@<5.2.5": ">=5.2.6"
  "http-proxy-middleware@>=0.16.0 <3.0.6": ">=3.0.6"
  "ws@>=8.0.0 <8.21.0": 8.21.3
  "ws@>=7.0.0 <7.5.11": 7.5.13
  "fast-uri@>=4.0.0": 4.1.5
  "fast-uri@>=3.0.0 <4.0.0": 3.1.8
  "svgo@>=3.0.0 <3.3.5": 3.3.5
  "svgo@>=2.0.0 <2.8.4": 2.8.4
