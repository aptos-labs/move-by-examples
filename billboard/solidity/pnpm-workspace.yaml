  "postcss-selector-parser@>=6.0.0 <6.1.3": 6.1.3
auditConfig:
  ignoreGhsas:
  - GHSA-337j-9hxr-rhxg
  - GHSA-848j-6mx2-7j84
  - GHSA-wrjc-x8rr-h8h6
pmOnFail: ignore
minimumReleaseAgeExclude:
- "next@15.5.25"
- "js-yaml@4.3.2"
- "axios@1.20.0"
- "undici@6.28.1"
- "postcss@8.5.28"
- "nanoid@3.3.19"
- "browserslist@4.28.7"
- "websocket-driver@0.7.5"
- "brace-expansion@1.1.21"
- "brace-expansion@2.1.7"
- "adm-zip@0.6.1"
- "react-router-dom@6.30.6"
allowBuilds:
  keccak: true
  secp256k1: true
